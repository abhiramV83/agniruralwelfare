<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0e8" />
    <meta
      name="description"
      content="Agni Rural Welfare Society — permission-based demo redesign."
    />
    <title>Agni Rural Welfare Society</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("agni-theme"); } catch { /* Use system preference when storage is unavailable. */ }
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#070d11" : "#f2f0e8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
